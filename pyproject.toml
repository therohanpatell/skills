[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dtf-test-gen"
version = "0.1.0"
description = "Local, AI-assisted generator of minimal transformation-aware BigQuery test data for DTF pipelines"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "streamlit>=1.36",
    "pydantic>=2.7",
    "PyYAML>=6.0",
    "httpx>=0.27",
    "Jinja2>=3.1",
    "rich>=13.7",
    "pandas>=2.2",
]

[project.scripts]
dtf-test-gen = "dtf_test_gen.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
